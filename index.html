<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Bakery Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #fff0f5; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #d87093; }
        .score-board { font-size: 20px; font-weight: bold; color: #ff69b4; margin: 15px 0; }
        .bakery-items { display: flex; justify-content: space-around; margin-top: 20px; }
        .item-btn { background-color: #ffb6c1; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .item-btn:hover { background-color: #ff69b4; color: white; }
        .character { font-size: 50px; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sweet Bakery 🧁</h1>
    <p>Welcome to our Bakery! Bake delicious treats for customers!</p>
    
    <div class="character">👩‍🍳</div>
    <p><strong>Baker Emma</strong> is ready to serve!</p>

    <div class="score-board">Score: <span id="score">0</span></div>

    <h3>Select a Bakery Item to Serve:</h3>
    <div class="bakery-items">
        <button class="item-btn" onclick="serveItem('Croissant', 10)">🥐 Croissant</button>
        <button class="item-btn" onclick="serveItem('Cupcake', 15)">🧁 Cupcake</button>
        <button class="item-btn" onclick="serveItem('Strawberry Cake', 25)">🍰 Cake</button>
    </div>

    <p id="message" style="margin-top: 20px; color: #4682b4; font-weight: bold;"></p>
</div>

<script>
    let currentScore = 0;

    function serveItem(itemName, points) {
        currentScore += points;
        document.getElementById('score').innerText = currentScore;
        document.getElementById('message').innerText = "You served a delicious " + itemName + "! +" + points + " Points!";
    }
</script>

</body>
</html>
